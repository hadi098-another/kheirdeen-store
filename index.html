<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>Stock Withdrawal</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- =========================
       LOGIN
  ========================== -->
  <section id="loginScreen" class="screen">
    <div class="card login-card">
      <h1>سحب البضاعة</h1>
      <p class="subtitle">تسجيل الدخول</p>

      <label for="password">كلمة المرور</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="أدخل كلمة المرور"
      />

      <button id="loginBtn" type="button" class="btn primary">
        دخول
      </button>

      <div id="loginMsg" class="message"></div>
    </div>
  </section>


  <!-- =========================
       MENU
  ========================== -->
  <section id="menuScreen" class="screen hidden">

    <div class="card topbar">
      <div>
        <span>المستخدم:</span>
        <strong id="menuUser">-</strong>
      </div>

      <button id="menuLogoutBtn" type="button" class="btn danger">
        تسجيل خروج
      </button>
    </div>

    <div class="card menu-card">

      <h2>القائمة الرئيسية</h2>

      <button id="addNewBtn" type="button" class="menu-btn">
        ➕ إضافة سحب جديد
      </button>

      <button id="fastPasteBtn" type="button" class="menu-btn">
        ⚡ إدخال سريع
      </button>

      <button id="reviewBtn" type="button" class="menu-btn">
        📋 مراجعة السحوبات
      </button>

      <button id="reportBtn" type="button" class="menu-btn">
        📊 التقرير
      </button>

    </div>
  </section>


  <!-- =========================
       NORMAL FORM
  ========================== -->
  <section id="formScreen" class="screen hidden">

    <div class="card topbar">
      <div>
        <span>المستخدم:</span>
        <strong id="currentUser">-</strong>
      </div>

      <div class="topbar-actions">
        <button id="backFromFormBtn" type="button" class="btn secondary">
          رجوع
        </button>

        <button id="logoutBtn" type="button" class="btn danger">
          خروج
        </button>
      </div>
    </div>

    <div class="card">

      <h2>إضافة سحب جديد</h2>

      <form id="stockForm">

        <label for="customer">اسم الزبون</label>

        <input
          id="customer"
          type="text"
          autocomplete="off"
          placeholder="اسم الزبون"
          required
        />

        <h3>السندويش</h3>

        <div id="sandwichItems" class="items-grid"></div>

        <h3>الكوكيز</h3>

        <div id="cookieItems" class="items-grid"></div>

        <div class="form-actions">

          <button
            id="displayBtn"
            type="button"
            class="btn secondary"
          >
            معاينة
          </button>

          <button
            id="submitBtn"
            type="submit"
            class="btn primary"
          >
            حفظ السحب
          </button>

        </div>

        <div id="formMsg" class="message"></div>

      </form>

      <div id="resultCard" class="result-card hidden">
        <h3>النتيجة</h3>
        <div id="result"></div>
      </div>

    </div>
  </section>


  <!-- =========================
       FAST PASTE
  ========================== -->
  <section id="fastPasteScreen" class="screen hidden">

    <div class="card topbar">

      <div>
        <span>المستخدم:</span>
        <strong id="fastPasteUser">-</strong>
      </div>

      <div class="topbar-actions">

        <button
          id="backFromFastPasteBtn"
          type="button"
          class="btn secondary"
        >
          رجوع
        </button>

        <button
          id="fastPasteLogoutBtn"
          type="button"
          class="btn danger"
        >
          خروج
        </button>

      </div>

    </div>

    <div class="card">

      <h2>إدخال سريع</h2>

      <form id="fastPasteForm">

        <label for="fastCustomer">اسم الزبون</label>

        <input
          id="fastCustomer"
          type="text"
          autocomplete="off"
          placeholder="اسم الزبون"
          required
        />

        <label for="fastOrderText">
          الصق الطلب هنا
        </label>

        <textarea
          id="fastOrderText"
          rows="12"
          placeholder="مثال:
Red 24
Cheese 48
Chocolate 24
Cookies Vanilla 2"
        ></textarea>

        <div class="form-actions">

          <button
            id="parseFastBtn"
            type="button"
            class="btn secondary"
          >
            تحليل
          </button>

          <button
            id="saveFastBtn"
            type="submit"
            class="btn primary"
          >
            حفظ
          </button>

        </div>

        <div id="fastMsg" class="message"></div>

      </form>

      <div id="fastPreviewCard" class="result-card hidden">

        <h3>المعاينة</h3>

        <div id="fastPreview"></div>

      </div>

    </div>
  </section>


  <!-- =========================
       REPORT
  ========================== -->
  <section id="reportScreen" class="screen hidden">

    <div class="card topbar report-no-print">

      <div>
        <span>المستخدم:</span>
        <strong id="reportUser">-</strong>
      </div>

      <div class="topbar-actions">

        <button
          id="backFromReportBtn"
          type="button"
          class="btn secondary"
        >
          رجوع
        </button>

        <button
          id="reportLogoutBtn"
          type="button"
          class="btn danger"
        >
          خروج
        </button>

      </div>

    </div>

    <div class="card report-card">

      <div class="report-toolbar report-no-print">

        <div>
          <h2>تقرير سحب البضاعة</h2>
          <p class="report-help">
            يمكنك تحريك الجدول يميناً ويساراً على الهاتف.
          </p>
        </div>

        <div class="report-actions">

          <button
            id="downloadReportBtn"
            type="button"
            class="btn primary"
          >
            📥 تحميل PDF
          </button>

          <button
            id="printReportBtn"
            type="button"
            class="btn secondary"
          >
            🖨️ طباعة
          </button>

        </div>

      </div>

      <div id="reportMsg" class="message report-no-print"></div>

      <div id="reportContent" class="report-content"></div>

    </div>

  </section>


  <!-- =========================
       REVIEW
  ========================== -->
  <section id="reviewScreen" class="screen hidden">

    <div class="card topbar">

      <div>
        <span>المستخدم:</span>
        <strong id="reviewUser">-</strong>
      </div>

      <div class="topbar-actions">

        <button
          id="backFromReviewBtn"
          type="button"
          class="btn secondary"
        >
          رجوع
        </button>

        <button
          id="reviewLogoutBtn"
          type="button"
          class="btn danger"
        >
          خروج
        </button>

      </div>

    </div>

    <div class="card">

      <h2>مراجعة السحوبات</h2>

      <input
        id="customerSearch"
        type="text"
        placeholder="ابحث باسم الزبون..."
        autocomplete="off"
      />

      <div id="reviewMsg" class="message"></div>

      <div id="reviewList"></div>

    </div>

  </section>


  <!-- html2pdf -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script src="script.js"></script>

</body>
</html>
